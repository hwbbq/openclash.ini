port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
bind-address: "*"
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090

clash-for-android:
  append-system-dns: false

profile:
  tracing: true
  store-selected: true

experimental:
  sniff-tls-sni: true
  quic-go-disable-gso: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true

  default-nameserver:
    - 202.96.128.68
    - 202.96.134.33
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  proxy-server-nameserver:
    - tls://223.6.6.6:853
    - tls://120.53.53.53
    - tls://1.12.12.12
    - 119.29.29.29
    - 223.5.5.5

  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time1.google.com
    - time2.google.com
    - "*.music.163.com"
    - "*.126.net"
    - "workgroup"


